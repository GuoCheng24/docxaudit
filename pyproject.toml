[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docxaudit"
version = "0.1.0"
description = "Find what your converter silently dropped from a .docx. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Guo Cheng" }]
keywords = ["docx", "ooxml", "pandoc", "word", "manuscript", "publishing",
            "validation", "linter", "latex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.scripts]
docxaudit = "docxaudit.cli:main"

[project.urls]
Homepage = "https://github.com/GuoCheng24/docxaudit"
Issues = "https://github.com/GuoCheng24/docxaudit/issues"

[tool.setuptools.packages.find]
include = ["docxaudit*"]
