[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docxaudit"
version = "0.1.4"
description = "Find what your converter silently dropped from a .docx. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Guo Cheng" }]
keywords = ["docx", "ooxml", "pandoc", "word", "manuscript", "publishing",
            "validation", "linter", "latex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Topic :: Text Processing :: Markup :: XML",
  "Topic :: Text Processing :: Markup",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.18"]

[project.scripts]
docxaudit = "docxaudit.cli:main"

[project.urls]
Homepage = "https://github.com/GuoCheng24/docxaudit"
Issues = "https://github.com/GuoCheng24/docxaudit/issues"

[tool.setuptools.packages.find]
include = ["docxaudit*"]
